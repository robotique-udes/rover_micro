name: PIO Build All Project

on:
    pull_request:
      branches:
        - release/**
    push:
      branches:
        - release/**

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Clean PlatformIO framework cache
        run: |
          rm -rf ~/.platformio/packages/framework-arduinoespressif32
          rm -rf ~/.platformio/.cache

      - name: 
        run: |
            set -e

            scripts/build_all.sh
