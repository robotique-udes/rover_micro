; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = https://github.com/Jason2866/platform-espressif32.git#Arduino/IDF5
platform_packages = 
    platformio/framework-arduinoespressif32 @ symlink:///home/phil/rover/rover_micro/platformio/packages/framework-arduinoespressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_raw = true

lib_deps = 
    ; rover_can_lib=symlink://../lib/rover_can_lib
    ; lib_rover=symlink://../lib/lib_rover

build_unflags =
    -std=gnu++11
    -Wno-maybe-uninitialized
    -Wno-unused-function
    -Wno-unused-but-set-variable
    -Wno-unused-variable
    -Wno-deprecated-declarations
    -Wno-unused-parameter
    -Wno-sign-compare
    -Wno-error=maybe-uninitialized
    -Wno-error=unused-function
    -Wno-error=unused-but-set-variable
    -Wno-error=unused-variable
    -Wno-error=deprecated-declarations

build_flags =
    -Wall
    -Werror=all
    -Wextra

    '-D ARDUINO_USB_CDC_ON_BOOT=1'
    '-D ARDUINO_USB_MODE=1'

    '-D VERBOSE'
    '-D GLOBAL_SEVERITY_LEVEL=Logger::eSeverityLevels::DEBUG_'
